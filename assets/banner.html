<!doctype html><html><head><meta charset="utf-8"><style>
:root{--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;--ink:#ededf0;--ink2:#a8a8b0;--ink3:#8b8b94;--line:#2a2a30;--field:#1a1a1e}
html,body{margin:0;background:transparent}
